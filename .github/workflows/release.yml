name: release

# on a version tag (v1.2.3): build, test, and create the GitHub Release
# with notes from .github/releases/<tag>.md and the npm package tarball
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Tag matches package.json
        run: |
          version=$(bun -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != package.json v$version"; exit 1; }

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun test

      - run: bun pm pack

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/releases/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$GITHUB_REF_NAME" *.tgz --title "$GITHUB_REF_NAME" --verify-tag "$@"
